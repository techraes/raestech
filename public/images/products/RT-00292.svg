<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600" role="img" aria-label="Google Pixel 11 Pro Fold 256GB">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="80%">
      <stop offset="0%" stop-color="#6b7280" stop-opacity="0.9"/>
      <stop offset="55%" stop-color="#374151" stop-opacity="0.88"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="phoneBody" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.28"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="22" stdDeviation="26" flood-color="#000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <rect width="600" height="600" fill="url(#bg)"/>

  <g filter="url(#shadow)">
    <rect x="175" y="60" width="250" height="480" rx="34" fill="url(#phoneBody)" stroke="rgba(255,255,255,0.35)" stroke-width="2"/>
    <rect x="188" y="74" width="224" height="452" rx="26" fill="url(#screen)"/>
    <rect x="270" y="88" width="60" height="6" rx="3" fill="#cbd5e1"/>
    <circle cx="316" cy="106" r="4" fill="#94a3b8"/>
    <text x="300" y="150" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700" letter-spacing="2" fill="#475569" text-anchor="middle">Google</text>
    <text x="300" y="200" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="800" fill="#0f172a" text-anchor="middle">Pixel 11 Pro Fold</text>
    <rect x="236" y="236" width="128" height="44" rx="22" fill="#0f172a"/>
    <text x="300" y="264" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">256GB · 16GB</text>
    <g transform="translate(300,360)" stroke="#0f172a" stroke-width="3" fill="none" stroke-linecap="round">
      <rect x="-36" y="-52" width="72" height="104" rx="12"/>
      <line x1="-4" y1="44" x2="4" y2="44"/>
    </g>
  </g>

  <circle cx="300" cy="512" r="26" fill="rgba(255,255,255,0.18)"/>
  <text x="300" y="521" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="800" fill="#fff" text-anchor="middle">G</text>
</svg>