# RAES TECH — Supabase project configuration.
project_id = "raestech"

[api]
enabled = true
port = 54321

[db]
port = 54322

# Base URL of the deployed app. Used to build auth URLs and as a redirect
# allow-list. Keep this pointing directly at the app (NOT at Vercel's SSO
# endpoint) so confirmation links don't bounce through SSO.
[auth]
site_url = "https://raestech.store"
additional_redirect_urls = ["http://localhost:5173", "https://raestech-raes3.vercel.app"]

[auth.email]
enable_signup = true
otp_length = 6
# OTP expiry in seconds (10 minutes). This matches the app's "code expires
# shortly" messaging and the recommended 5-10 minute window. Apply the same
# value to the hosted project under Authentication -> Email OTP expiry (the
# config.toml value only governs local/self-hosted runs).
otp_expiry = 600

# OTP login/registration must deliver a 6-digit CODE, not a magic link. The
# default Supabase templates render {{ .ConfirmationURL }}, which (a) sends a
# link instead of the numeric code the app expects, and (b) currently redirects
# through Vercel's SSO for this deployment. These overrides send the code
# (`{{ .Token }}`) so no confirmation URL is needed at all.
[auth.email.template_magic_link]
subject = "Your RAES TECH sign-in code"
content_path = "./supabase/templates/magic_link.html"

[auth.email.template_confirmation]
subject = "Confirm your RAES TECH sign-up"
content_path = "./supabase/templates/confirmation.html"

# Google OAuth sign-in. Enabled by default so the login screen shows the Google
# button, but the provider only actually works once you supply credentials in
# the Supabase dashboard (Authentication > Providers > Google) AND the two env
# vars below. Client ID/secret live in the Google Cloud Console
# (APIs & Services > Credentials > OAuth 2.0 Client IDs).
[auth.external.google]
enabled = true
client_id = "env(GOOGLE_OAUTH_CLIENT_ID)"
secret = "env(GOOGLE_OAUTH_SECRET)"
redirect_uri = "https://raestech.store/auth/v1/callback"

# The admin-provisioning function is guarded by its own shared-secret header
# (Authorization: Bearer $ADMIN_SEED_SECRET), so it does NOT require a user JWT.
[functions.create-admin]
verify_jwt = false

# Transactional email sender (Resend). Requires a valid Supabase session JWT;
# it only sends to the authenticated user's own verified email. No shared
# secret is used, so nothing sensitive is exposed to the browser.
[functions.send-email]
verify_jwt = true
